aid: seventy-seven-energy
name: "Seventy Seven Energy"
description: >-
  Seventy Seven Energy Inc. was a diversified oilfield services company headquartered in
  Oklahoma City, providing wellsite services and equipment to U.S. land-based oil and
  natural gas exploration and production customers. It was formed in 2011 out of Chesapeake
  Energy's oilfield services arm and spun off as an independent public company, operating
  through affiliates including Nomac Drilling (contract land drilling), Performance
  Technologies (hydraulic fracturing and pressure pumping) and Great Plains Oilfield Rental
  (rental tools and equipment). After the 2014-2016 oil price collapse it completed a
  prepackaged Chapter 11 restructuring and recapitalization, emerging in August 2016. THE
  COMPANY NO LONGER EXISTS. Patterson-UTI Energy completed its merger with Seventy Seven
  Energy on 20 April 2017 in a transaction valued at roughly USD 1.76 billion, issuing about
  47.5 million shares and repaying USD 472 million of Seventy Seven Energy debt at closing;
  Nomac was absorbed into Patterson-UTI Drilling and Performance Technologies into Universal
  Pressure Pumping. Seventy Seven Energy never operated a public developer program, API,
  SDK, or machine-readable specification of any kind, and there is no surviving entity to
  publish one — its own domain, seventysevenenergy.com, no longer resolves.
