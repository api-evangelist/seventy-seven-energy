note: >-
  RECORDED ABSENCE, NOT A PRESENCE. Every /.well-known/ path probed returned HTTP 404, so
  NO WellKnown and NO SecurityTxt pointer is wired into apis.yml. Two separate findings sit
  behind that zero. First, Seventy Seven Energy has not existed as an independent company
  since 20 April 2017, when Patterson-UTI Energy completed its merger with it and folded
  its affiliates (Nomac Drilling, Great Plains Oilfield Rental, Performance Technologies)
  into Patterson-UTI Drilling and Universal Pressure Pumping. Second, and more importantly
  for anyone reading this profile, the host these probes ran against IS NOT AND NEVER WAS
  THE COMPANY'S DOMAIN — see host_attribution below. There is therefore no surface here to
  find, and the 404s below say nothing at all about the company's own former posture.
host_attribution:
  probed_host: www.seventy-seven-energy.com
  belongs_to_provider: false
  finding: >-
    seventy-seven-energy.com is a Wix-registered domain created 2024-01-12 — nearly seven
    years AFTER Seventy Seven Energy ceased to exist — and it has never been deployed. It
    resolves to Wix CDN addresses (185.230.63.171/.107/.186, ns4/ns5.wixdns.net) and answers
    every path, root included, with a 2,517-byte Wix "ConnectYourDomain Error" page carrying
    <meta name="robots" content="noindex">. The Wayback Machine holds exactly ONE capture of
    it in its entire history (2024-05-11), and that capture is already a 404, so the domain
    has never served content to anyone. It was wired into apis.yml as the Website pointer by
    slug-shaped guessing, not by evidence.
  actual_historic_domain: seventysevenenergy.com
  actual_historic_domain_state: >-
    NXDOMAIN — it no longer resolves. Wayback holds real captures back to 2016-01-09; the
    last successful capture is 2024-09-25 (HTTP 200) and a 2025-07-10 attempt failed to
    fetch, which brackets the domain's expiry. Not probed live for well-known documents
    because there is no longer a host to probe.
  action_taken: >-
    The Website pointer to https://www.seventy-seven-energy.com was REMOVED from apis.yml
    rather than left in place. A dead pointer is a false claim; a dead pointer at a domain a
    different registrant owns is also a misattribution, and it would hand this profile a
    third party's TLS and SPF posture.
